<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gato Aventurero: Fila Centrada</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
}

html, body {
    overflow: hidden;
    background: #1a1a1a;
    width: 100%;
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
}

#game-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background: #000;
}

canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    aspect-ratio: 2 / 1;
    background: #222;
    touch-action: none;
}
</style>
</head>

<body>

<div id="game-container">
    <canvas id="game" width="1000" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const container = document.getElementById("game-container");

function resetHeight() {
    let vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
    updateControlPositions();
}
window.addEventListener('resize', resetHeight);
window.addEventListener('orientationchange', () => setTimeout(resetHeight, 200));

const GRAVITY = 0.6;
const GAME_HEIGHT = 400; 

// ESCENARIO
const platforms = [
    {x: 0, y: 350, width: 3000, height: 50}, 
    {x: 300, y: 250, width: 250, height: 20},
    {x: 650, y: 180, width: 200, height: 20},
    {x: 950, y: 130, width: 300, height: 20},
    {x: 1350, y: 200, width: 250, height: 20},
    {x: 1700, y: 270, width: 300, height: 20},
    {x: 2100, y: 180, width: 150, height: 220},
	// --- NUEVA COLUMNA AL FINAL DEL MAPA ---
    {x: 2970, y: 200, width: 30, height: 150}
];

// JUGADOR
const player = {
    x: 100,
    y: 100,
    width: 45,
    height: 55,
    vx: 0,
    vy: 0,
    acceleration: 0.8,
    friction: 0.85, 
    maxSpeed: 6,
    jumpPower: -13.5,
    onGround: false,
    facing: "right", 
    shootCooldown: 0,
    lives: 5,
    gatifulis: 0,
    invulnerableFrames: 0,
    hasJetpack: false
};

// COFRE
const chest = {
    x: 500,
    y: 310, 
    width: 40,
    height: 40,
    opened: false,
    nearPlayer: false
};

// CÁMARA
const camera = { x: 0, width: canvas.width };
const keys = {};

// JOYSTICK
const joystick = {
    startX: 0,      
    startY: 0,
    currentX: 0,    
    currentY: 0,
    active: false,
    touchId: null,
    maxRadius: 32,  
    baseRadius: 42, 
    deadzone: 8     
};

// BOTONES TÁCTILES (Con el radio ampliado para que sean tan grandes como el joystick)
const actionButtons = {
    action: { radius: 42, active: false, label: "A", action: "e", x: 0, y: 0, visible: false }, 
    jetpack:{ radius: 42, active: false, label: "P", action: "Shift", x: 0, y: 0, visible: false },
    shoot:  { radius: 42, active: false, label: "D", action: "2", x: 0, y: 0, visible: true },
    jump:   { radius: 42, active: false, label: "▲", action: "ArrowUp", x: 0, y: 0, visible: true } 
};

const fsButton = { x: 930, y: 25, width: 50, height: 30 };

function updateControlPositions() {
    const w = canvas.width;
    const centerY = GAME_HEIGHT + 50; // Altura de la fila fija
    
    // Joystick izquierdo
    joystick.defaultX = 130; 
    joystick.defaultY = centerY;
    
    const spacing = 100; 
    const startX = w - 210; // Posición base de la extrema derecha

    // ORDEN DE IZQUIERDA A DERECHA: A -> P -> D -> ▲ (Salto)
    // Colocamos el de más a la derecha (Salto) en startX, y los demás hacia la izquierda restando espacio.
    actionButtons.jump.x = startX;                   // ▲ (Salto en el extremo derecho)
    actionButtons.jump.y = centerY;

    actionButtons.shoot.x = startX - spacing;          // D 
    actionButtons.shoot.y = centerY;

    actionButtons.jetpack.x = startX - (spacing * 2);  // P (Jetpack)
    actionButtons.jetpack.y = centerY;

    actionButtons.action.x = startX - (spacing * 3);   // A (Acción en la parte más a la izquierda de la botonera)
    actionButtons.action.y = centerY;
}

updateControlPositions();
resetHeight();

// CONTROLES PC
document.addEventListener("keydown", (e) => { if (e.key) keys[e.key] = true; });
document.addEventListener("keyup", (e) => { if (e.key) keys[e.key] = false; });

function getCanvasTouchCoords(touch) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (touch.clientX - rect.left) * (canvas.width / rect.width),
        y: (touch.clientY - rect.top) * (canvas.height / rect.height)
    };
}

// GESTIÓN TÁCTIL
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const coords = getCanvasTouchCoords(touch);
        
        if (coords.x < canvas.width / 2 && coords.y > GAME_HEIGHT) {
            if (!joystick.active) {
                joystick.active = true;
                joystick.touchId = touch.identifier;
                joystick.startX = coords.x;
                joystick.startY = coords.y;
                joystick.currentX = coords.x;
                joystick.currentY = coords.y;
            }
        }
        
        for (const key in actionButtons) {
            const btn = actionButtons[key];
            if (btn.visible && Math.hypot(coords.x - btn.x, coords.y - btn.y) < btn.radius) {
                btn.active = true;
                keys[btn.action] = true;
            }
        }
        
        if (coords.x >= fsButton.x && coords.x <= fsButton.x + fsButton.width &&
            coords.y >= fsButton.y - 10 && coords.y <= fsButton.y + fsButton.height) {
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen().catch(()=>{});
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            } catch(err) {}
        }
    }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        const coords = getCanvasTouchCoords(touch);
        if (joystick.active && touch.identifier === joystick.touchId) {
            joystick.currentX = coords.x;
            joystick.currentY = coords.y;
        }
    }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        
        if (joystick.active && touch.identifier === joystick.touchId) {
            joystick.active = false;
            joystick.touchId = null;
            keys["ArrowLeft"] = false;
            keys["ArrowRight"] = false;
        }
        
        const coords = getCanvasTouchCoords(touch);
        for (const key in actionButtons) {
            const btn = actionButtons[key];
            if (Math.hypot(coords.x - btn.x, coords.y - btn.y) < btn.radius) {
                btn.active = false;
                keys[btn.action] = false;
            }
        }
    }
    
    if (e.touches.length === 0) {
        joystick.active = false;
        keys["ArrowLeft"] = false;
        keys["ArrowRight"] = false;
        for (const key in actionButtons) {
            actionButtons[key].active = false;
            keys[actionButtons[key].action] = false;
        }
    }
}, { passive: false });

function processJoystick() {
    if (!joystick.active) return;

    const deltaX = joystick.currentX - joystick.startX;
    const deltaY = joystick.currentY - joystick.startY;
    const distance = Math.hypot(deltaX, deltaY);

    if (distance < joystick.deadzone) {
        keys["ArrowLeft"] = false;
        keys["ArrowRight"] = false;
        return;
    }

    const angle = Math.atan2(deltaY, deltaX);

    if (angle > -Math.PI * 0.4 && angle < Math.PI * 0.4) {
        keys["ArrowRight"] = true;
        keys["ArrowLeft"] = false;
    } 
    else if (angle > Math.PI * 0.6 || angle < -Math.PI * 0.6) {
        keys["ArrowLeft"] = true;
        keys["ArrowRight"] = false;
    } 
    else {
        keys["ArrowLeft"] = false;
        keys["ArrowRight"] = false;
    }
}

const enemies = [];
const bullets = [];
const particles = [];
const gatifulis = [];
let boss = {
    x: 2700,
    y: 240,           // Apoyado en el suelo principal (350 - 110 de altura)
    width: 90,
    height: 110,
    vx: 2,
    minX: 2500,
    maxX: 2850,
    lives: 25,
    active: true
};

const bossBullets = [];
// VARIABLES GLOBALES DE TODO EL JUEGO , VAMOONORRRRSLS UUUUEEEEEAA!!!!!!
let transitionAlpha = 0; // Controla la opacidad del fundido a negro (de 0 a 1)
let isTransitioning = false; // Indica si estamos en plena transición
let victory = false;
let victoryTimer = 0;
let gameFrame = 0;
let gameOverTimer = 0; 
let currentLevel = 1; // Controla en qué nivel estamos
let door = { x: 2850, y: 260, width: 40, height: 90, active: false }; // La puerta al derrotar al jefe

function spawnObjects() {
    enemies.length = 0; gatifulis.length = 0; bullets.length = 0; particles.length = 0; platforms.length = 0;
    bossBullets.length = 0;
    
    chest.opened = false;
    player.hasJetpack = false;
    actionButtons.action.visible = false;
    actionButtons.jetpack.visible = false;
    
    if (currentLevel === 1) {
        // --- CONFIGURACIÓN NIVEL 1 ---
        player.lives = 5; 
        player.gatifulis = 0;
        player.x = 100; 
        player.y = 100; 
        player.vx = 0; 
        player.vy = 0;
        camera.x = 0;
        victory = false;
        door.active = false;

        // Plataformas Nivel 1
        platforms.push(
            {x: 0, y: 350, width: 3000, height: 50}, 
            {x: 300, y: 250, width: 250, height: 20},
            {x: 650, y: 180, width: 200, height: 20},
            {x: 950, y: 130, width: 300, height: 20},
            {x: 1350, y: 200, width: 250, height: 20},
            {x: 1700, y: 270, width: 300, height: 20},
            {x: 2100, y: 180, width: 150, height: 220},
            {x: 2970, y: 200, width: 30, height: 150}
        );

        // Enemigos Nivel 1
        enemies.push(
            { x: 400, y: 200, width: 40, height: 50, vx: 1.5, minX: 300, maxX: 510 },
            { x: 1050, y: 80, width: 40, height: 50, vx: 1.2, minX: 950, maxX: 1210 },
            { x: 1400, y: 150, width: 40, height: 50, vx: -1.5, minX: 1350, maxX: 1560 },
            { x: 1800, y: 220, width: 40, height: 50, vx: 2, minX: 1700, maxX: 1960 }
        );

        // Monedas Nivel 1
        const coinPositions = [
            {x: 150, y: 280}, {x: 420, y: 180}, {x: 750, y: 120},
            {x: 1080, y: 70}, {x: 1470, y: 130}, {x: 1850, y: 200},
            {x: 2170, y: 100}
        ];
        coinPositions.forEach(pos => {
            gatifulis.push({ x: pos.x, y: pos.y, width: 20, height: 20, baseIndex: Math.random() * 100 });
        });

        // Reiniciar Jefe
        boss.x = 2700;
        boss.y = 240;
        boss.lives = 25;
        boss.active = true;

    } else if (currentLevel === 2) {
        // --- CONFIGURACIÓN NIVEL 2 ---
        player.lives = 5;     
        player.gatifulis = 0;
        player.x = 100; 
        player.y = 100; 
        player.vx = 0; 
        player.vy = 0;
        camera.x = 0;
        victory = false;
        door.active = false;

        // Plataformas básicas para el Nivel 2 
        platforms.push(
            {x: 0, y: 350, width: 2000, height: 50},
            {x: 400, y: 250, width: 200, height: 20},
            {x: 800, y: 180, width: 200, height: 20}
        );

        // Sin jefe por ahora
        boss.active = false;

        // --- BURBUJA DE TEXTO PARA EL NIVEL 2 ---
        level2Sign = {
            x: 600,            // Posición X donde aparecerá flotando
            y: 120,            // Posición Y
            width: 280,
            height: 60,
            text: "Level 2 is coming soon!"
        };
    }
}
spawnObjects();

function createExplosion(x, y, colorType) {
    let count = colorType === "jetpack" ? 4 : 12;
    for (let i = 0; i < count; i++) {
        const angle = colorType === "jetpack" ? (Math.PI/2 + (Math.random()*0.4 - 0.2)) : (Math.random() * Math.PI * 2);
        const speed = colorType === "jetpack" ? (1 + Math.random() * 2) : (1 + Math.random() * 3);
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed + (colorType === "jetpack" ? player.vx * 0.4 : 0), 
            vy: Math.sin(angle) * speed,
            size: colorType === "jetpack" ? (2 + Math.random() * 2) : (3 + Math.random() * 2),
            color: colorType === "coin" ? "#FFD700" : colorType === "jetpack" ? (Math.random() > 0.4 ? "#ff6600" : "#555555") : (Math.random() > 0.5 ? "#4a8a3b" : "#ff3333"),
            alpha: 1, decay: colorType === "jetpack" ? 0.08 : 0.04
        });
    }
}

function handleDamage() {
    if (player.invulnerableFrames > 0 || gameOverTimer > 0) return;
    player.lives--;
    
    if (player.lives <= 0) {
        gameOverTimer = 120; 
        return;
    }
    
    player.invulnerableFrames = 60;
    player.x = Math.max(100, player.x - 150);
    player.y = 100;
    player.vx = 0; 
    player.vy = 0;
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

function updatePlayer() {
    if (gameOverTimer > 0) return; 
    if (player.invulnerableFrames > 0) player.invulnerableFrames--;
    if (player.shootCooldown > 0) player.shootCooldown--;

    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) { 
        player.vx -= player.acceleration; 
        player.facing = "left"; 
    }
    else if (keys["ArrowRight"] || keys["d"] || keys["D"]) { 
        player.vx += player.acceleration; 
        player.facing = "right"; 
    }
    else { 
        player.vx *= player.friction; 
    }

    if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
    if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;

    const isPropelling = player.hasJetpack && (keys["Shift"] || actionButtons.jetpack.active);
    if ((keys["ArrowUp"] || keys["w"] || keys["W"]) && player.onGround && !isPropelling) {
        player.vy = player.jumpPower;
        player.onGround = false;
    }

    if (isPropelling) {
        player.vy -= 0.95; 
        if (player.vy < -4.5) player.vy = -4.5; 
        let jetX = player.facing === "right" ? player.x + 5 : player.x + player.width - 5;
        let jetY = player.y + 35;
        createExplosion(jetX, jetY, "jetpack");
    } else {
        player.vy += GRAVITY;
    }

    let distToChest = Math.hypot((player.x + player.width/2) - (chest.x + chest.width/2), (player.y + player.height/2) - (chest.y + chest.height/2));
    if (distToChest < 70 && !chest.opened) {
        chest.nearPlayer = true;
        actionButtons.action.visible = true; 
        
        if (keys["e"] || keys["E"] || actionButtons.action.active) {
            chest.opened = true;
            player.hasJetpack = true;
            actionButtons.action.visible = false;
            actionButtons.jetpack.visible = true; 
            createExplosion(chest.x + chest.width/2, chest.y, "coin");
            actionButtons.action.active = false;
            keys["e"] = false; keys["E"] = false;
        }
    } else {
        chest.nearPlayer = false;
        if (!chest.opened) actionButtons.action.visible = false;
    }

    player.x += player.vx;
    for (const p of platforms) {
        if (checkCollision(player, p)) {
            if (player.vx > 0) player.x = p.x - player.width;
            else if (player.vx < 0) player.x = p.x + p.width;
            player.vx = 0;
        }
    }

    player.y += player.vy;
    player.onGround = false;
    for (const p of platforms) {
        if (checkCollision(player, p)) {
            if (player.vy > 0) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.onGround = true;
            } else if (player.vy < 0) {
                player.y = p.y + p.height;
                player.vy = 0;
            }
        }
    }

    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.y > GAME_HEIGHT + 60) {
        handleDamage();
    }

    if ((keys["2"] || keys["f"] || keys["F"]) && player.shootCooldown === 0) {
        bullets.push({
            x: player.facing === "right" ? player.x + player.width : player.x - 10,
            y: player.y + 22,
            vx: player.facing === "right" ? 11 : -11,
            width: 12, height: 6, active: true
        });
        player.shootCooldown = 18;
    }

    camera.x += (player.x - canvas.width / 3 - camera.x) * 0.08;
    if (camera.x < 0) camera.x = 0;
}

function updateObjects() {
    if (gameOverTimer > 0) return; 

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; 
        b.x += b.vx;
        let hitWall = false;
        for (const p of platforms) {
            if (checkCollision(b, p)) hitWall = true;
        }
        if (b.x < camera.x || b.x > camera.x + canvas.width || !b.active || hitWall) {
            bullets.splice(i, 1);
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const z = enemies[i]; 
        z.x += z.vx;
        if (z.x < z.minX || z.x > z.maxX) z.vx = -z.vx;

        if (checkCollision(player, z)) {
            handleDamage();
            return; 
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (checkCollision(b, z)) {
                createExplosion(z.x + z.width/2, z.y + z.height/2, "zombie");
                enemies.splice(i, 1); 
                bullets.splice(j, 1); 
                break;
            }
        }
    }

    for (let i = gatifulis.length - 1; i >= 0; i--) {
        const c = gatifulis[i];
        if (checkCollision(player, c)) {
            createExplosion(c.x + c.width/2, c.y + c.height/2, "coin");
            player.gatifulis++; 
            gatifulis.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; 
        p.x += p.vx; 
        p.y += p.vy; 
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
}
function updateDoor() {
    if (!door.active || isTransitioning) return;
    
    // Si el jugador choca con la puerta
    if (checkCollision(player, door)) {
        isTransitioning = true; // Activamos el fundido de salida
        victory = false;        // Quitamos cualquier cartel que quedara
    }
}
function updateBoss() {

    if (!boss.active || victory) return;

    boss.x += boss.vx;

    if (boss.x < boss.minX || boss.x > boss.maxX) {
        boss.vx *= -1;
    }

    // Disparo del boss
    if (gameFrame % 70 === 0) {

        let dx =
            (player.x + player.width / 2) -
            (boss.x + boss.width / 2);

        let dy =
            (player.y + player.height / 2) -
            (boss.y + boss.height / 2);

        const len = Math.hypot(dx, dy);

        bossBullets.push({
            x: boss.x + boss.width / 2,
            y: boss.y + 40,
            vx: dx / len * 5,
            vy: dy / len * 5,
            width: 12,
            height: 12
        });
    }

    
    // Balas del boss
    for (let i = bossBullets.length - 1; i >= 0; i--) {

        const b = bossBullets[i];

        b.x += b.vx;
        b.y += b.vy;

        if (checkCollision(player, b)) {
            handleDamage();
            bossBullets.splice(i, 1);
            continue;
        }

        // Comprobar si choca contra alguna plataforma
        let hitWall = false;
        for (const p of platforms) {
            if (checkCollision(b, p)) {
                hitWall = true;
                break;
            }
        }

        if (
            hitWall ||
            b.x < 0 ||
            b.x > 3000 ||
            b.y < 0 ||
            b.y > GAME_HEIGHT
        ) {
            bossBullets.splice(i, 1);
        }
    }

    // Daño al boss
    for (let i = bullets.length - 1; i >= 0; i--) {

        if (checkCollision(bullets[i], boss)) {

            boss.lives--;
            bullets.splice(i, 1);

            createExplosion(
                boss.x + boss.width / 2,
                boss.y + boss.height / 2,
                "zombie"
            );

            if (boss.lives <= 0) {
                boss.active = false;
                victory = true;     
                door.active = true; 
                victoryTimer = 180; // <--- 3 segundos de duración (60fps * 3)

                createExplosion(
                    boss.x + boss.width / 2,
                    boss.y + boss.height / 2,
                    "coin"
                );
            }
        }
    }

    if (checkCollision(player, boss)) {
        handleDamage();
    }
}
function drawBoss() {

    if (!boss.active) return;

    const x = boss.x - camera.x;
    const y = boss.y;

    // cuerpo
    ctx.fillStyle = "#7b1fa2";
    ctx.fillRect(x, y + 20, boss.width, boss.height - 20);

    // cabeza
    ctx.fillStyle = "#9c27b0";
    ctx.beginPath();
    ctx.arc(x + boss.width/2, y + 15, 25, 0, Math.PI * 2);
    ctx.fill();

    // ojos
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(x + 35, y + 10, 4, 0, Math.PI*2);
    ctx.arc(x + 55, y + 10, 4, 0, Math.PI*2);
    ctx.fill();

    // barra de vida
    ctx.fillStyle = "black";
    ctx.fillRect(x, y - 20, boss.width, 10);

    ctx.fillStyle = "red";
    ctx.fillRect(
        x,
        y - 20,
        boss.width * (boss.lives / 25),
        10
    );
}

function drawInterface() {
    for (let i = 0; i < 5; i++) {
        const hX = 30 + i * 35; const hY = 25;
        ctx.fillStyle = i < player.lives ? "#ff9900" : "#555"; 
        ctx.beginPath();
        ctx.moveTo(hX - 10, hY - 4); ctx.lineTo(hX - 12, hY - 14); ctx.lineTo(hX - 4, hY - 6);
        ctx.moveTo(hX + 10, hY - 4); ctx.lineTo(hX + 12, hY - 14); ctx.lineTo(hX + 4, hY - 6);
        ctx.fill();
        ctx.beginPath(); ctx.arc(hX, hY, 10, 0, Math.PI * 2); ctx.fill();
        if (i < player.lives) {
            ctx.fillStyle = "black"; ctx.fillRect(hX - 4, hY - 3, 2, 3); ctx.fillRect(hX + 2, hY - 3, 2, 3);
            ctx.fillStyle = "pink"; ctx.fillRect(hX - 1, hY + 2, 2, 2);
        }
    }

    const mX = canvas.width - 240; const mY = 25;
    ctx.fillStyle = "#FFD700"; ctx.strokeStyle = "#DAA520"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mX, mY, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#FFF"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center"; ctx.fillText("G", mX, mY + 4);
    ctx.fillStyle = "white"; ctx.font = "bold 20px Courier New"; ctx.textAlign = "left";
    ctx.fillText(`x ${String(player.gatifulis).padStart(3, '0')}`, mX + 20, mY + 7);

    ctx.fillStyle = "#333"; ctx.strokeStyle = "#ff9900"; ctx.lineWidth = 2;
    ctx.fillRect(fsButton.x, fsButton.y - 10, fsButton.width, fsButton.height);
    ctx.strokeRect(fsButton.x, fsButton.y - 10, fsButton.width, fsButton.height);
    ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
    ctx.fillText("⛶ FULL", fsButton.x + 25, fsButton.y + 9);

    if (gameOverTimer > 0) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, GAME_HEIGHT);
        ctx.fillStyle = "#ff3333"; ctx.font = "bold 44px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("¡GAME OVER!", canvas.width / 2, GAME_HEIGHT / 2);
    }
    if (victory) {

    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,canvas.width,GAME_HEIGHT);

    ctx.fillStyle = "#00ff66";
    ctx.font = "bold 44px Arial";
    ctx.textAlign = "center";
    ctx.fillText("¡Level 1 completed, eres el puto amo!",canvas.width/2,GAME_HEIGHT/2);
    }

}

function drawBackground() {
    // 1. Cielo azul del nivel
    ctx.fillStyle = "#87CEEB"; 
    ctx.fillRect(0, 0, canvas.width, GAME_HEIGHT);
    
    // 2. Sol brillante con paralaje suave (más hacia el centro y libre de los marcadores)
    // Usamos (camera.x * 0.15) para que se desplace despacito al caminar
    let sunX = 500 - (camera.x * 0.15); 
    let sunY = 90;
    
    ctx.fillStyle = "#FFD700"; 
    ctx.beginPath(); 
    ctx.arc(sunX, sunY, 35, 0, Math.PI * 2); 
    ctx.fill();
    
    // Opcional: Un pequeño halo exterior para darle brillo
    ctx.fillStyle = "rgba(255, 255, 0, 0.2)";
    ctx.beginPath(); 
    ctx.arc(sunX, sunY, 45, 0, Math.PI * 2); 
    ctx.fill();
}

function drawGatifulis() {
    ctx.save();
    for (const c of gatifulis) {
        const bobbing = Math.sin((gameFrame + c.baseIndex) * 0.08) * 5;
        const rX = c.x - camera.x + c.width / 2; 
        const rY = c.y + bobbing + c.height / 2;
        
        // 1. Círculo exterior dorado de la moneda
        ctx.fillStyle = "#FFD700"; 
        ctx.strokeStyle = "#DAA520"; 
        ctx.lineWidth = 2;
        ctx.beginPath(); 
        ctx.arc(rX, rY, 14, 0, Math.PI * 2); 
        ctx.fill(); 
        ctx.stroke();

        // 2. Círculo interior para dar relieve y contraste
        ctx.fillStyle = "#f39c12";
        ctx.beginPath();
        ctx.arc(rX, rY, 10, 0, Math.PI * 2);
        ctx.fill();

        // 3. Letra G grande, centrada y legible
        ctx.fillStyle = "#FFFFFF"; 
        ctx.font = "bold 15px Arial"; 
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle";
        ctx.fillText("G", rX, rY + 1);
    }
    ctx.restore();
}

function drawPlatforms() {
    for (const p of platforms) {
        const renderX = p.x - camera.x;
        ctx.fillStyle = "#7A4B23"; ctx.fillRect(renderX, p.y, p.width, p.height);
        ctx.fillStyle = "#5A8F3D"; ctx.fillRect(renderX, p.y, p.width, 6);
    }
}

function drawChest() {
    const cx = chest.x - camera.x;
    const cy = chest.y;
    
    ctx.save();
    if (!chest.opened) {
        ctx.fillStyle = "#5c3a21";
        ctx.fillRect(cx, cy, chest.width, chest.height);
        ctx.fillStyle = "#DAA520";
        ctx.fillRect(cx, cy, chest.width, 8); 
        ctx.fillRect(cx + chest.width/2 - 4, cy + 12, 8, 10); 
    } else {
        ctx.fillStyle = "#3d2414";
        ctx.fillRect(cx, cy + 10, chest.width, chest.height - 10);
        ctx.fillStyle = "#DAA520";
        ctx.fillRect(cx, cy - 2, chest.width, 8); 
    }
    ctx.restore();
}

function drawPlayer() {
    if (player.invulnerableFrames > 0 && Math.floor(gameFrame / 4) % 2 === 0) return; 
    const x = player.x - camera.x; const y = player.y;
    ctx.save();
    
    if (player.facing === "left") {
        ctx.translate(x + player.width/2, y + player.height/2); ctx.scale(-1, 1); ctx.translate(-(x + player.width/2), -(y + player.height/2));
    }
    
    if (player.hasJetpack) {
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(x + 2, y + 22, 10, 20); 
        ctx.fillStyle = "#95a5a6";
        ctx.fillRect(x + 4, y + 20, 6, 2);   
    }

    ctx.strokeStyle = "#ff9900"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x + 5, y + 25); ctx.lineTo(x - 10, y + 15); ctx.stroke();
    ctx.fillStyle = "#ff9900"; ctx.fillRect(x + 10, y + 18, 22, 22);
    ctx.fillStyle = "#ffb347"; ctx.beginPath(); ctx.arc(x + 22, y + 12, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 12, y + 5); ctx.lineTo(x + 16, y - 8); ctx.lineTo(x + 20, y + 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 24, y + 4); ctx.lineTo(x + 29, y - 8); ctx.lineTo(x + 34, y + 4); ctx.fill();
    ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(x + 27, y + 10, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "pink"; ctx.beginPath(); ctx.arc(x + 31, y + 14, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#5A381E"; ctx.fillRect(x + 10, y + 40, 8, 10); ctx.fillRect(x + 25, y + 40, 8, 10);
    ctx.fillStyle = "#555"; ctx.fillRect(x + 28, y + 18, 15, 6);
    ctx.fillStyle = "#333"; ctx.fillRect(x + 26, y + 20, 5, 8);
    ctx.fillStyle = "#ff3333"; ctx.fillRect(x + 38, y + 19, 6, 2);
    ctx.restore();
}
function drawLevel2Sign() {
    // Solo se dibuja si estamos en el Nivel 2 y la burbuja existe
    if (currentLevel !== 2 || !level2Sign) return;

    const dx = level2Sign.x - camera.x;
    const dy = level2Sign.y;

    // Si la burbuja está fuera de la pantalla, nos ahorramos dibujarla
    if (dx < -300 || dx > canvas.width + 300) return;

    // Fondo de la burbuja (estilo cómic/retro)
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.strokeStyle = "#ff00aa"; // Un borde llamativo (puedes cambiar el color)
    ctx.lineWidth = 3;

    // Dibujamos un rectángulo con esquinas redondeadas para el bocadillo
    ctx.beginPath();
    ctx.roundRect(dx, dy, level2Sign.width, level2Sign.height, 10);
    ctx.fill();
    ctx.stroke();

    // Pequeño triángulo del bocadillo apuntando hacia abajo
    ctx.beginPath();
    ctx.moveTo(dx + level2Sign.width / 2 - 10, dy + level2Sign.height);
    ctx.lineTo(dx + level2Sign.width / 2, dy + level2Sign.height + 12);
    ctx.lineTo(dx + level2Sign.width / 2 + 10, dy + level2Sign.height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.fill();
    ctx.strokeStyle = "#ff00aa";
    ctx.stroke();

    // Texto del cartel
    ctx.fillStyle = "#222222";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(
        level2Sign.text, 
        dx + level2Sign.width / 2, 
        dy + level2Sign.height / 2
    );
    
    // Restauramos valores por defecto de texto por si acaso
    ctx.textBaseline = "alphabetic";
}
function drawDoor() {
    if (!door.active) return;
    
    const dx = door.x - camera.x;
    const dy = door.y;

    // Sombra exterior para darle profundidad
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fillRect(dx - 6, dy - 6, door.width + 12, door.height + 12);

    // Marco exterior de piedra/metal oscuro
    ctx.fillStyle = "#22252a";
    ctx.fillRect(dx - 4, dy - 4, door.width + 8, door.height + 4);
    ctx.strokeStyle = "#4e5d6c";
    ctx.lineWidth = 2;
    ctx.strokeRect(dx - 4, dy - 4, door.width + 8, door.height + 4);

    // Interior del portal con brillo pulsante (varía suavemente con el tiempo)
    let pulse = Math.sin(Date.now() / 200) * 0.2 + 0.8; // Oscila entre 0.6 y 1.0
    ctx.fillStyle = `rgba(0, 240, 255, ${pulse})`;
    ctx.fillRect(dx, dy, door.width, door.height);

    // Remate central brillante (el núcleo del portal)
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.7})`;
    ctx.fillRect(dx + 10, dy + 15, door.width - 20, door.height - 30);

    // Texto indicador superior con estilo
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 8;
    ctx.fillText("✨ NIVEL 2 ✨", dx + door.width/2, dy - 12);
    ctx.shadowBlur = 0; // Limpiamos el efecto de sombra para que no afecte a lo demás
}
function drawEnemies() {
    for (const z of enemies) {
        const x = z.x - camera.x; const y = z.y;
        ctx.save();
        if (z.vx < 0) {
            ctx.translate(x + z.width/2, y + z.height/2); ctx.scale(-1, 1); ctx.translate(-(x + z.width/2), -(y + z.height/2));
        }
        ctx.fillStyle = "#2e5c1e"; ctx.fillRect(x + 10, y + 15, 20, 25);
        ctx.fillStyle = "#4a8a3b"; ctx.beginPath(); ctx.arc(x + 20, y + 8, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x + 24, y + 6, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#4a8a3b"; ctx.fillRect(x + 20, y + 18, 18, 6);
        ctx.fillStyle = "#1b2d42"; ctx.fillRect(x + 10, y + 40, 8, 10); ctx.fillRect(x + 22, y + 40, 8, 10);
        ctx.restore();
    }
}

function drawTouchPanel() {
    ctx.save();
    ctx.fillStyle = "#151515"; ctx.fillRect(0, GAME_HEIGHT, canvas.width, 100);
    ctx.strokeStyle = "#333"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, GAME_HEIGHT); ctx.lineTo(canvas.width, GAME_HEIGHT); ctx.stroke();

    const baseCenterX = joystick.active ? joystick.startX : joystick.defaultX;
    const baseCenterY = joystick.active ? joystick.startY : joystick.defaultY;

    ctx.fillStyle = "rgba(40, 40, 40, 0.7)";
    ctx.strokeStyle = joystick.active ? "#ff9900" : "#555";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(baseCenterX, baseCenterY, joystick.baseRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    let stickX = baseCenterX;
    let stickY = baseCenterY;

    if (joystick.active) {
        const angle = Math.atan2(joystick.currentY - joystick.startY, joystick.currentX - joystick.startX);
        const dist = Math.hypot(joystick.currentX - joystick.startX, joystick.currentY - joystick.startY);
        const moveDist = Math.min(dist, joystick.maxRadius);
        stickX = joystick.startX + Math.cos(angle) * moveDist;
        stickY = joystick.startY + Math.sin(angle) * moveDist;
    }

    ctx.fillStyle = joystick.active ? "#ff9900" : "#888";
    ctx.beginPath(); ctx.arc(stickX, stickY, 20, 0, Math.PI * 2); ctx.fill();

    // DIBUJAR BOTONES EN FILA CENTRALIZADA
    for (const key in actionButtons) {
        const btn = actionButtons[key];
        if (!btn.visible) continue; 

        ctx.fillStyle = btn.active ? "#444" : "#252525";
        ctx.strokeStyle = btn.active ? "#ff9900" : "#333";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        
        if (btn.label === "A") ctx.fillStyle = "#5dade2"; 
        else if (btn.label === "P") ctx.fillStyle = "#e67e22"; 
        else ctx.fillStyle = btn.active ? "#ff9900" : "#bbb";
        
        ctx.font = "bold 22px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(btn.label, btn.x, btn.y + 2);
    }
    ctx.restore();
}

function gameLoop() {
    gameFrame++;
    
	if (victory) {
        if (victoryTimer > 0) {
            victoryTimer--;
        } else {
            // Cuando pasan los 3 segundos, SOLO quitamos el cartel. 
            // La puerta sigue abierta y el jefe muerto esperando a que el jugador cruce.
            victory = false;
        }
    }
	// Lógica del fundido de transición al Nivel 2
    if (isTransitioning) {
        transitionAlpha += 0.02; // Velocidad del fundido (cuanto mayor, más rápido)
        if (transitionAlpha >= 1) {
            transitionAlpha = 1;
            currentLevel = 2;     // Cambiamos oficialmente al Nivel 2
            spawnObjects();       // Cargamos el nuevo nivel con la pantalla en negro
            isTransitioning = false; // Desactivamos el estado de transición para empezar a aclarar
        }
    } else if (transitionAlpha > 0) {
        transitionAlpha -= 0.02; // Aclara la pantalla suavemente al aparecer en el Nivel 2
        if (transitionAlpha < 0) transitionAlpha = 0;
    }

    if (gameOverTimer > 0) {
        gameOverTimer--;
        if (gameOverTimer === 0) spawnObjects(); 
    } else {
        processJoystick(); 
        updatePlayer();
        updateObjects();
        updateBoss();
        updateDoor(); 
    }
    if (gameOverTimer > 0) {
        gameOverTimer--;
        if (gameOverTimer === 0) spawnObjects(); 
    } else {
        processJoystick(); 
        updatePlayer();
        updateObjects();
        updateBoss();
        updateDoor(); // <--- Comprueba si entramos en la puerta
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawPlatforms();
    drawChest(); 
    drawGatifulis();
    
    ctx.fillStyle = "#ff3333";
    for (const b of bullets) ctx.fillRect(b.x - camera.x, b.y, b.width, b.height);
    
    drawEnemies();
    drawBoss();
    
    for (const p of particles) {
        ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x - p.size/2, p.y - p.size/2, p.size, p.size); ctx.restore();
    }
    
  ctx.fillStyle = "#bb00ff";
  
  for (const b of bossBullets) {
    ctx.beginPath();
    ctx.arc(
        b.x - camera.x,
        b.y,
        6,
        0,
        Math.PI * 2
    );
    ctx.fill();
  }
	drawDoor();
    drawPlayer();
    drawInterface(); 
    drawTouchPanel();
	drawLevel2Sign(); // <--- ¡Añadido aquí para que se dibuje en el Nivel 2!
    // Dibuja el fundido a negro si estamos transicionando
    if (transitionAlpha > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
