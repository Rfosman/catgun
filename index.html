<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gato Aventurero vs Zombies - Canvas Táctil</title>

<style>
*{
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; /* Desactiva gestos nativos del móvil como zoom o scroll */
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
}

#game-container {
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 2 / 1;
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #87CEEB;
    border: 3px solid #333;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<div id="game-container">
    <canvas id="game" width="1000" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.6;

// JUGADOR
const player = {
    x: 100,
    y: 100,
    width: 45,
    height: 55,
    vx: 0,
    vy: 0,
    acceleration: 0.8,
    friction: 0.85, 
    maxSpeed: 6,
    jumpPower: -14,
    onGround: false,
    facing: "right", 
    shootCooldown: 0
};

// CÁMARA
const camera = {
    x: 0,
    width: canvas.width
};

// ESTADO DE CONTROLES (Teclado y Táctil unificados)
const keys = {};

// CONFIGURACIÓN DE BOTONES EN CANVAS (Coordenadas virtuales del canvas de 1000x500)
const touchButtons = {
    left:   { x: 80,  y: 420, radius: 40, active: false, label: "◀", action: "ArrowLeft" },
    right:  { x: 190, y: 420, radius: 40, active: false, label: "▶", action: "ArrowRight" },
    jump:   { x: 810, y: 420, radius: 40, active: false, label: "0", action: "0", title: "SALTAR" },
    shoot:  { x: 920, y: 420, radius: 40, active: false, label: "2", action: "2", title: "DISPARAR" }
};

// 1. SOPORTE TECLADO (PC)
document.addEventListener("keydown", (e) => {
    if (e.key) keys[e.key] = true;
});

document.addEventListener("keyup", (e) => {
    if (e.key) keys[e.key] = false;
});

// 2. SOPORTE TÁCTIL INTEGRADO EN CANVAS
// Traduce la coordenada de la pantalla real a la coordenada virtual (1000x500) del canvas
function getCanvasTouchCoords(touch) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
    };
}

function handleTouches(e) {
    e.preventDefault();
    
    // Apagar todas las acciones de botones táctiles antes de recalcular
    for (const key in touchButtons) {
        touchButtons[key].active = false;
        keys[touchButtons[key].action] = false;
    }

    // Comprobar cada dedo activo en la pantalla
    for (let i = 0; i < e.touches.length; i++) {
        const coords = getCanvasTouchCoords(e.touches[i]);
        
        for (const key in touchButtons) {
            const btn = touchButtons[key];
            // Distancia matemática entre el dedo y el centro del botón circular
            const dist = Math.hypot(coords.x - btn.x, coords.y - btn.y);
            
            if (dist < btn.radius) {
                btn.active = true;
                keys[btn.action] = true; // Activa la tecla correspondiente
            }
        }
    }
}

// Eventos de pantalla táctil
canvas.addEventListener("touchstart", handleTouches, { passive: false });
canvas.addEventListener("touchmove", handleTouches, { passive: false });
canvas.addEventListener("touchend", handleTouches, { passive: false });


// PLATAFORMAS
const platforms = [
    {x: 0, y: 450, width: 3000, height: 50}, 
    {x: 300, y: 350, width: 250, height: 20},
    {x: 650, y: 280, width: 200, height: 20},
    {x: 950, y: 200, width: 300, height: 20},
    {x: 1350, y: 280, width: 250, height: 20},
    {x: 1700, y: 350, width: 300, height: 20},
    {x: 2100, y: 250, width: 150, height: 200}
];

const enemies = [];
const bullets = [];
const particles = [];

function spawnZombies() {
    enemies.length = 0; 
    enemies.push(
        { x: 400, y: 300, width: 40, height: 50, vx: 1.5, minX: 300, maxX: 510 },
        { x: 1050, y: 150, width: 40, height: 50, vx: 1.2, minX: 950, maxX: 1210 },
        { x: 1400, y: 230, width: 40, height: 50, vx: -1.5, minX: 1350, maxX: 1560 },
        { x: 1800, y: 300, width: 40, height: 50, vx: 2, minX: 1700, maxX: 1960 }
    );
}
spawnZombies();

function createExplosion(x, y) {
    const particleCount = 20;
    for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 4,
            color: Math.random() > 0.5 ? "#4a8a3b" : "#ff3333",
            alpha: 1,
            decay: 0.02 + Math.random() * 0.03
        });
    }
}

function updatePlayer() {
    // Movimiento horizontal
    if (keys["ArrowLeft"]) {
        player.vx -= player.acceleration;
        player.facing = "left";
    } else if (keys["ArrowRight"]) {
        player.vx += player.acceleration;
        player.facing = "right";
    } else {
        player.vx *= player.friction;
    }

    if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
    if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;

    // Salto
    const wantsToJump = keys["0"] || keys["ArrowUp"];
    if (wantsToJump && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
    }

    player.vy += GRAVITY;

    player.x += player.vx;
    handleCollisions("x");

    player.y += player.vy;
    player.onGround = false;
    handleCollisions("y");

    if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
    }

    if (player.y > canvas.height) {
        resetGame();
    }

    // Disparo
    if (player.shootCooldown > 0) {
        player.shootCooldown--;
    }

    const wantsToShoot = keys["2"];
    if (wantsToShoot && player.shootCooldown === 0) {
        const bulletSpeed = 12;
        const bulletDirection = player.facing === "right" ? 1 : -1;
        
        const bulletX = player.facing === "right" ? player.x + 43 : player.x + 2;
        const bulletY = player.y + 21;

        bullets.push({
            x: bulletX,
            y: bulletY,
            vx: bulletSpeed * bulletDirection,
            width: 10,
            height: 6,
            active: true
        });
        
        player.shootCooldown = 15;
    }

    const targetCamX = player.x - canvas.width / 3;
    camera.x += (targetCamX - camera.x) * 0.1;
    if (camera.x < 0) camera.x = 0;
}

function handleCollisions(axis) {
    for (const p of platforms) {
        if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y
        ) {
            if (axis === "x") {
                if (player.vx > 0) player.x = p.x - player.width;
                else if (player.vx < 0) player.x = p.x + p.width;
                player.vx = 0;
            } else if (axis === "y") {
                if (player.vy > 0) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                } else if (player.vy < 0) {
                    player.y = p.y + p.height;
                    player.vy = 0;
                }
            }
        }
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;

        for (const p of platforms) {
            if (
                b.x < p.x + p.width &&
                b.x + b.width > p.x &&
                b.y < p.y + p.height &&
                b.y + b.height > p.y
            ) {
                b.active = false;
                break;
            }
        }

        if (b.x < camera.x || b.x > camera.x + canvas.width) {
            b.active = false;
        }

        if (!b.active) {
            bullets.splice(i, 1);
        }
    }
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const z = enemies[i];
        
        z.x += z.vx;
        if (z.x < z.minX) {
            z.x = z.minX;
            z.vx = -z.vx;
        } else if (z.x > z.maxX) {
            z.x = z.maxX;
            z.vx = -z.vx;
        }

        if (
            player.x < z.x + z.width &&
            player.x + player.width > z.x &&
            player.y < z.y + z.height &&
            player.y + player.height > z.y
        ) {
            resetGame();
            return;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (
                b.x < z.x + z.width &&
                b.x + b.width > z.x &&
                b.y < z.y + z.height &&
                b.y + b.height > z.y
            ) {
                createExplosion(z.x + z.width / 2, z.y + z.height / 2);
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
            particles.splice(i, 1);
        }
    }
}

function resetGame() {
    player.x = 100;
    player.y = 100;
    player.vx = 0;
    player.vy = 0;
    bullets.length = 0;
    particles.length = 0;
    spawnZombies();
}

function drawBackground() {
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(800 - camera.x * 0.1, 80, 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    const cloudOffset = -camera.x * 0.25;
    
    ctx.beginPath();
    ctx.arc(200 + cloudOffset, 120, 30, 0, Math.PI * 2);
    ctx.arc(230 + cloudOffset, 120, 30, 0, Math.PI * 2);
    ctx.arc(260 + cloudOffset, 120, 30, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatforms() {
    for (const p of platforms) {
        const renderX = p.x - camera.x;
        ctx.fillStyle = "#7A4B23";
        ctx.fillRect(renderX, p.y, p.width, p.height);
        ctx.fillStyle = "#5A8F3D";
        ctx.fillRect(renderX, p.y, p.width, 6);
    }
}

function drawPlayer() {
    const x = player.x - camera.x;
    const y = player.y;

    ctx.save();
    
    if (player.facing === "left") {
        ctx.translate(x + player.width / 2, y + player.height / 2);
        ctx.scale(-1, 1);
        ctx.translate(-(x + player.width / 2), -(y + player.height / 2));
    }

    ctx.strokeStyle = "#ff9900";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + 5, y + 25);
    ctx.lineTo(x - 10, y + 15);
    ctx.stroke();

    ctx.fillStyle = "#ff9900";
    ctx.fillRect(x + 10, y + 18, 22, 22);

    ctx.fillStyle = "#ffb347";
    ctx.beginPath();
    ctx.arc(x + 22, y + 12, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + 12, y + 5);
    ctx.lineTo(x + 16, y - 8);
    ctx.lineTo(x + 20, y + 4);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + 24, y + 4);
    ctx.lineTo(x + 29, y - 8);
    ctx.lineTo(x + 34, y + 4);
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(x + 27, y + 10, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "pink";
    ctx.beginPath();
    ctx.arc(x + 31, y + 14, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 32, y + 14); ctx.lineTo(x + 40, y + 11);
    ctx.moveTo(x + 32, y + 14); ctx.lineTo(x + 40, y + 14);
    ctx.moveTo(x + 32, y + 14); ctx.lineTo(x + 40, y + 17);
    ctx.stroke();

    ctx.fillStyle = "#5A381E";
    ctx.fillRect(x + 10, y + 40, 8, 10);
    ctx.fillRect(x + 25, y + 40, 8, 10);

    ctx.fillStyle = "#555";
    ctx.fillRect(x + 28, y + 18, 15, 6);
    ctx.fillStyle = "#333";
    ctx.fillRect(x + 26, y + 20, 5, 8);
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(x + 38, y + 19, 6, 2);

    ctx.restore();
}

function drawEnemies() {
    for (const z of enemies) {
        const x = z.x - camera.x;
        const y = z.y;

        ctx.save();
        if (z.vx < 0) {
            ctx.translate(x + z.width / 2, y + z.height / 2);
            ctx.scale(-1, 1);
            ctx.translate(-(x + z.width / 2), -(y + z.height / 2));
        }

        ctx.fillStyle = "#2e5c1e";
        ctx.fillRect(x + 10, y + 15, 20, 25);

        ctx.fillStyle = "#4a8a3b";
        ctx.beginPath();
        ctx.arc(x + 20, y + 8, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(x + 24, y + 6, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#4a8a3b";
        ctx.fillRect(x + 20, y + 18, 18, 6);

        ctx.fillStyle = "#1b2d42";
        ctx.fillRect(x + 10, y + 40, 8, 10);
        ctx.fillRect(x + 22, y + 40, 8, 10);

        ctx.restore();
    }
}

function drawBullets() {
    ctx.fillStyle = "#ff3333";
    for (const b of bullets) {
        ctx.fillRect(b.x - camera.x, b.y, b.width, b.height);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
    }
}

// DIBUJAR LOS BOTONES TÁCTILES TRANSPARENTES
function drawTouchControls() {
    // Comprobar si estamos en un dispositivo táctil (para no ensuciar la pantalla en PC si no se quiere)
    // Opcional: si quieres que se vean SIEMPRE, quita la condición. De momento los dejamos visibles siempre.
    
    ctx.save();
    
    for (const key in touchButtons) {
        const btn = touchButtons[key];
        
        // Círculo base del botón (Transparencia adaptativa según si está pulsado o no)
        ctx.fillStyle = btn.active ? "rgba(255, 255, 255, 0.6)" : "rgba(255, 255, 255, 0.25)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        ctx.lineWidth = 3;
        
        ctx.beginPath();
        ctx.arc(btn.x, btn.y, btn.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Letra o Símbolo del botón (0, 2, Flechas)
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(btn.label, btn.x, btn.y + 2); // Pequeño ajuste para centrar
        
        // Texto superior explicativo ("SALTAR", "DISPARAR")
        if (btn.title) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.font = "bold 13px Arial";
            ctx.fillText(btn.title, btn.x, btn.y - btn.radius - 12);
        }
    }
    
    ctx.restore();
}

function gameLoop() {
    updatePlayer();
    updateBullets();
    updateEnemies();
    updateParticles();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();
    drawPlatforms();
    drawBullets();
    drawEnemies();
    drawParticles();
    drawPlayer();
    
    // Pinta los botones encima de todo
    drawTouchControls();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
