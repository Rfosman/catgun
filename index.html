<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gato Aventurero vs Zombies - ¡Explosiones!</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
}

canvas{
    display:block;
    background:#87CEEB;
    border:4px solid #2e2e2e;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<canvas id="game" width="1000" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.6;

// JUGADOR
const player = {
    x: 100,
    y: 100,
    width: 45,
    height: 55,
    vx: 0,
    vy: 0,
    acceleration: 0.8,
    friction: 0.85, 
    maxSpeed: 6,
    jumpPower: -14,
    onGround: false,
    facing: "right", 
    shootCooldown: 0
};

// CÁMARA
const camera = {
    x: 0,
    width: canvas.width
};

// CONTROL DE TECLAS
const keys = {};

document.addEventListener("keydown", (e) => {
    if (e.key) {
        keys[e.key] = true;
    }
});

document.addEventListener("keyup", (e) => {
    if (e.key) {
        keys[e.key] = false;
    }
});

// PLATAFORMAS DEL ESCENARIO
const platforms = [
    {x: 0, y: 450, width: 3000, height: 50}, 
    {x: 300, y: 350, width: 250, height: 20},
    {x: 650, y: 280, width: 200, height: 20},
    {x: 950, y: 200, width: 300, height: 20},
    {x: 1350, y: 280, width: 250, height: 20},
    {x: 1700, y: 350, width: 300, height: 20},
    {x: 2100, y: 250, width: 150, height: 200}
];

// ENEMIGOS, BALAS Y PARTÍCULAS (Explosiones)
const enemies = [];
const bullets = [];
const particles = [];

function spawnZombies() {
    enemies.length = 0; 
    enemies.push(
        { x: 400, y: 300, width: 40, height: 50, vx: 1.5, minX: 300, maxX: 510 },
        { x: 1050, y: 150, width: 40, height: 50, vx: 1.2, minX: 950, maxX: 1210 },
        { x: 1400, y: 230, width: 40, height: 50, vx: -1.5, minX: 1350, maxX: 1560 },
        { x: 1800, y: 300, width: 40, height: 50, vx: 2, minX: 1700, maxX: 1960 }
    );
}
spawnZombies();

// Crear explosión de partículas en una posición (x, y)
function createExplosion(x, y) {
    const particleCount = 20; // Número de partículas por explosión
    for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 4,
            color: Math.random() > 0.5 ? "#4a8a3b" : "#ff3333", // Mezcla de sangre zombie (verde) y fuego de plasma (rojo)
            alpha: 1,
            decay: 0.02 + Math.random() * 0.03 // Velocidad a la que desaparece la partícula
        });
    }
}

function updatePlayer() {
    // Movimiento horizontal (Flechas Izquierda / Derecha)
    if (keys["ArrowLeft"]) {
        player.vx -= player.acceleration;
        player.facing = "left";
    } else if (keys["ArrowRight"]) {
        player.vx += player.acceleration;
        player.facing = "right";
    } else {
        player.vx *= player.friction;
    }

    // Límites de velocidad
    if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
    if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;

    // SALTO: Activo con la tecla "0" (Cero) o "ArrowUp" (Flecha Arriba)
    const wantsToJump = keys["0"] || keys["ArrowUp"];
    
    if (wantsToJump && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
    }

    player.vy += GRAVITY;

    // Colisiones
    player.x += player.vx;
    handleCollisions("x");

    player.y += player.vy;
    player.onGround = false;
    handleCollisions("y");

    // Límite izquierdo del escenario
    if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
    }

    // Caída al vacío (Reinicio)
    if (player.y > canvas.height) {
        resetGame();
    }

    // SISTEMA DE DISPARO: Activado con la tecla "2"
    if (player.shootCooldown > 0) {
        player.shootCooldown--;
    }

    const wantsToShoot = keys["2"];
    if (wantsToShoot && player.shootCooldown === 0) {
        const bulletSpeed = 12;
        const bulletDirection = player.facing === "right" ? 1 : -1;
        
        // Ajustamos la salida de la bala exactamente desde la punta de la pistola
        const bulletX = player.facing === "right" ? player.x + 43 : player.x + 2;
        const bulletY = player.y + 21;

        bullets.push({
            x: bulletX,
            y: bulletY,
            vx: bulletSpeed * bulletDirection,
            width: 10,
            height: 6,
            active: true
        });
        
        player.shootCooldown = 15; // Retardo entre disparos
    }

    // Movimiento de la Cámara (Scroll lateral)
    const targetCamX = player.x - canvas.width / 3;
    camera.x += (targetCamX - camera.x) * 0.1;
    if (camera.x < 0) camera.x = 0;
}

function handleCollisions(axis) {
    for (const p of platforms) {
        if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y
        ) {
            if (axis === "x") {
                if (player.vx > 0) player.x = p.x - player.width;
                else if (player.vx < 0) player.x = p.x + p.width;
                player.vx = 0;
            } else if (axis === "y") {
                if (player.vy > 0) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                } else if (player.vy < 0) {
                    player.y = p.y + p.height;
                    player.vy = 0;
                }
            }
        }
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;

        // Choque con plataformas (se destruye sin explosión de zombie)
        for (const p of platforms) {
            if (
                b.x < p.x + p.width &&
                b.x + b.width > p.x &&
                b.y < p.y + p.height &&
                b.y + b.height > p.y
            ) {
                b.active = false;
                break;
            }
        }

        // Salir de pantalla
        if (b.x < camera.x || b.x > camera.x + canvas.width) {
            b.active = false;
        }

        if (!b.active) {
            bullets.splice(i, 1);
        }
    }
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const z = enemies[i];
        
        // Movimiento de patrulla
        z.x += z.vx;
        if (z.x < z.minX) {
            z.x = z.minX;
            z.vx = -z.vx;
        } else if (z.x > z.maxX) {
            z.x = z.maxX;
            z.vx = -z.vx;
        }

        // Colisión con el Jugador
        if (
            player.x < z.x + z.width &&
            player.x + player.width > z.x &&
            player.y < z.y + z.height &&
            player.y + player.height > z.y
        ) {
            resetGame();
            return;
        }

        // Colisión con balas e Impacto explosivo
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (
                b.x < z.x + z.width &&
                b.x + b.width > z.x &&
                b.y < z.y + z.height &&
                b.y + b.height > z.y
            ) {
                // Crear explosión en el centro del zombie
                createExplosion(z.x + z.width / 2, z.y + z.height / 2);

                enemies.splice(i, 1); // El zombie muere
                bullets.splice(j, 1); // La bala desaparece
                break;
            }
        }
    }
}

// Actualizar las partículas de la explosión
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay; // Desvanecimiento gradual

        if (p.alpha <= 0) {
            particles.splice(i, 1);
        }
    }
}

function resetGame() {
    player.x = 100;
    player.y = 100;
    player.vx = 0;
    player.vy = 0;
    bullets.length = 0;
    particles.length = 0; // Limpiar explosiones anteriores
    spawnZombies();
}

function drawBackground() {
    // Cielo
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sol con paralaje
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(800 - camera.x * 0.1, 80, 40, 0, Math.PI * 2);
    ctx.fill();

    // Nubes blancas
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    const cloudOffset = -camera.x * 0.25;
    
    ctx.beginPath();
    ctx.arc(200 + cloudOffset, 120, 30, 0, Math.PI * 2);
    ctx.arc(230 + cloudOffset, 120, 30, 0, Math.PI * 2);
    ctx.arc(260 + cloudOffset, 120, 30, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatforms() {
    for (const p of platforms) {
        const renderX = p.x - camera.x;

        // Estructura de tierra
        ctx.fillStyle = "#7A4B23";
        ctx.fillRect(renderX, p.y, p.width, p.height);

        // Césped verde brillante
        ctx.fillStyle = "#5A8F3D";
        ctx.fillRect(renderX, p.y, p.width, 6);
    }
}

function drawPlayer() {
    const x = player.x - camera.x;
    const y = player.y;

    ctx.save();
    
    // Girar dibujo según dirección
    if (player.facing === "left") {
        ctx.translate(x + player.width / 2, y + player.height / 2);
        ctx.scale(-1, 1);
        ctx.translate(-(x + player.width / 2), -(y + player.height / 2));
    }

    // Cola del gato
    ctx.strokeStyle = "#ff9900";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + 5, y + 25);
    ctx.lineTo(x - 10, y + 15);
    ctx.stroke();

    // Cuerpo
    ctx.fillStyle = "#ff9900";
    ctx.fillRect(x + 10, y + 18, 22, 22);

    // Cabeza
    ctx.fillStyle = "#ffb347";
    ctx.beginPath();
    ctx.arc(x + 22, y + 12, 12, 0, Math.PI * 2);
    ctx.fill();

    // Orejas
    ctx.beginPath();
    ctx.moveTo(x + 12, y + 5);
    ctx.lineTo(x + 16, y - 8);
    ctx.lineTo(x + 20, y + 4);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + 24, y + 4);
    ctx.lineTo(x + 29, y - 8);
    ctx.lineTo(x + 34, y + 4);
    ctx.fill();

    // Ojo
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(x + 27, y + 10, 2, 0, Math.PI * 2);
    ctx.fill();

    // Nariz
    ctx.fillStyle = "pink";
    ctx.beginPath();
    ctx.arc(x + 31, y + 14, 2, 0, Math.PI * 2);
    ctx.fill();

    // Bigotes
    ctx.strokeStyle = "black";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 32, y + 14); ctx.lineTo(x + 40, y + 11);
    ctx.moveTo(x + 32, y + 14); ctx.lineTo(x + 40, y + 14);
    ctx.moveTo(x + 32, y + 14); ctx.lineTo(x + 40, y + 17);
    ctx.stroke();

    // Botas
    ctx.fillStyle = "#5A381E";
    ctx.fillRect(x + 10, y + 40, 8, 10);
    ctx.fillRect(x + 25, y + 40, 8, 10);

    // Pistola de Plasma
    ctx.fillStyle = "#555";
    ctx.fillRect(x + 28, y + 18, 15, 6);
    ctx.fillStyle = "#333";
    ctx.fillRect(x + 26, y + 20, 5, 8);
    ctx.fillStyle = "#ff3333"; // Láser rojo de apuntado
    ctx.fillRect(x + 38, y + 19, 6, 2);

    ctx.restore();
}

function drawEnemies() {
    for (const z of enemies) {
        const x = z.x - camera.x;
        const y = z.y;

        ctx.save();
        if (z.vx < 0) {
            ctx.translate(x + z.width / 2, y + z.height / 2);
            ctx.scale(-1, 1);
            ctx.translate(-(x + z.width / 2), -(y + z.height / 2));
        }

        // Cuerpo zombie
        ctx.fillStyle = "#2e5c1e";
        ctx.fillRect(x + 10, y + 15, 20, 25);

        // Cabeza zombie
        ctx.fillStyle = "#4a8a3b";
        ctx.beginPath();
        ctx.arc(x + 20, y + 8, 10, 0, Math.PI * 2);
        ctx.fill();

        // Ojo hambriento (Rojo)
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(x + 24, y + 6, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Brazos estirados
        ctx.fillStyle = "#4a8a3b";
        ctx.fillRect(x + 20, y + 18, 18, 6);

        // Pantalón roto
        ctx.fillStyle = "#1b2d42";
        ctx.fillRect(x + 10, y + 40, 8, 10);
        ctx.fillRect(x + 22, y + 40, 8, 10);

        ctx.restore();
    }
}

function drawBullets() {
    ctx.fillStyle = "#ff3333"; // Balas de plasma rojas bien visibles
    for (const b of bullets) {
        ctx.fillRect(b.x - camera.x, b.y, b.width, b.height);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
    }
}

function gameLoop() {
    updatePlayer();
    updateBullets();
    updateEnemies();
    updateParticles();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();
    drawPlatforms();
    drawBullets();
    drawEnemies();
    drawParticles(); // Dibujar explosiones sobre los enemigos y el escenario
    drawPlayer();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
